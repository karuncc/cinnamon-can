# cinnamon-can configuration
# ==========================
#
# Copy this file to start:
#
#     cp config/example.conf config/default.conf
#
# Other configs can sit next to it (config/laptop.conf) and are chosen with
#     cinnamon-can -c laptop seal
#
# Rules: "name = value"; lines starting with # are comments; text after
# "  #" at the end of a line is a comment too.

[general]

# Where cans are kept. ~ means your home folder.
backup_dir = ~/cinnamon-cans


[items]

# Every item follows its own "default" (see items/*.item) unless you set
# it here.   yes = keep it and restore it    no = leave it out
# Remove the "#" in front of a line to use it.

# --- On by default ----------------------------------------------------
#appearance     = yes   # themes, icons, pointer, fonts, wallpaper
#panel          = yes   # panels, applets and their settings, hot corners
#desktop        = yes   # desktop icons and their positions
#menu           = yes   # menu layout, favourites, your launchers
#keyboard       = yes   # layouts, all shortcuts, repeat speed, input method
#mouse-touchpad = yes   # double-click, pointer speed, scrolling, gestures
#windows        = yes   # window behaviour, workspaces, Alt-Tab, effects
#sound          = yes   # sound effects, alert sounds, your sound themes
#power          = yes   # power, screen blanking, lock screen
#default-apps   = yes   # preferred apps, terminal, startup apps
#nemo           = yes   # file manager preferences and bookmarks
#language       = yes   # display language and formats of your account
#system         = yes   # login screen, system language, time zone (sudo)
#software       = yes   # list of apps you installed (never installed for you)
#other          = yes   # remaining desktop settings (date & time ...)
#app-settings   = yes   # settings apps keep in the settings database

# --- Off by default: switch on what you want --------------------------
#shell          = no    # .bashrc, .profile, ~/.local/bin, crontab ...
#dev-tools      = no    # .gitconfig, .vimrc, .nanorc, VS Code settings
#personal       = no    # account picture, launchers, dictionary, templates
#hardware       = no    # monitors, text & pointer size (same model only)

# --- Your own items ---------------------------------------------------
# Put NAME.item files in config/items/ (look at items/ for examples) and
# switch them on or off here like any other item.
#
# Cans are NOT encrypted: never add keys or passwords (~/.ssh, keyrings).
